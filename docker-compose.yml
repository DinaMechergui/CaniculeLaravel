services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devspark_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - devspark_network

  web:
    image: nginx:alpine
    container_name: devspark_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - devspark_network

  db:
    image: mysql:8.0
    container_name: devspark_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: alerte_canicule
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - devspark_mysql_data:/var/lib/mysql
    networks:
      - devspark_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: devspark_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - devspark_network

  prometheus:
    image: prom/prometheus:latest
    container_name: devspark_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - devspark_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - devspark_network

  grafana:
    image: grafana/grafana:latest
    container_name: devspark_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/devspark_dashboard.json
    volumes:
      - devspark_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - devspark_network
    depends_on:
      - prometheus

  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: devspark_mysql_exporter
    restart: unless-stopped
    volumes:
      - ./docker/mysql_exporter/.my.cnf:/.my.cnf:ro
    ports:
      - "9104:9104"
    networks:
      - devspark_network

networks:
  devspark_network:
    name: devspark_network
    external: true

volumes:
  devspark_mysql_data:
    driver: local
  devspark_prometheus_data:
    driver: local
  devspark_grafana_data:
    driver: local

