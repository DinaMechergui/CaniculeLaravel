sonar.projectKey=DevSpark
sonar.projectName=DevSpark
sonar.projectVersion=1.0

# Répertoires à analyser
sonar.sources=app,routes,resources/views
sonar.tests=tests

# Encodage
sonar.sourceEncoding=UTF-8

# Rapports de tests PHPUnit
sonar.php.tests.reportPath=reports/phpunit.xml

# Exclusions de l'analyse
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,bootstrap/cache/**,tests/**
